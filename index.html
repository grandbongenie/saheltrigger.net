<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="meta.home">SahelTrigger</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="styles.css?v=20261108n" />
  <link rel="stylesheet" href="i18n/i18n.css?v=11" />
  <link rel="stylesheet" href="i18n/legal.css?v=4" />

</head>
<body>
  <main class="grid">
    <div class="logo" aria-label="Sahel Trigger brand" data-i18n-attr="aria-label:home.brandAria">
      <a class="brand" href="index.html" aria-label="Go to home" data-i18n-attr="aria-label:home.goHome">
        <img src="logo_sahel_trigger.png" alt="Sahel Trigger" />
      </a>
    </div>

    <div class="hero-orb" aria-hidden="true">
      <div class="orb-text" data-text="welcome to saheltrigger.net, this website documents the activities connected to the utopia of reforesting the sahel-sahara region in the service of life."></div>
    </div>

    <div class="nav-band">
      <nav class="nav" aria-label="Primary" data-i18n-attr="aria-label:nav.label">
        <a class="nav-logo" href="index.html" aria-label="Sahel Trigger home" data-i18n-attr="aria-label:nav.homeAria">
          <img src="logo_sahel_trigger.png" alt="Sahel Trigger logo" data-i18n-attr="alt:nav.logoAlt" />
        </a>
        <a href="reforestation.html" data-i18n="nav.refo">Reforestation</a>
        <a href="perf.html" data-i18n="nav.perf">Perf</a>
        <a href="report.html" data-i18n="nav.report">Report</a>
      </nav>
    </div>

    <aside class="newsletter-box" aria-label="Newsletter subscription" data-i18n-attr="aria-label:home.nlAria">
      <h2 data-i18n="home.nlTitle">Newsletter</h2>
      <form class="newsletter-form" novalidate>
        <label for="newsletter-email" data-i18n="home.nlEmail">Email</label>
        <div class="newsletter-row">
          <input
            id="newsletter-email"
            name="EMAIL"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            data-i18n-attr="placeholder:home.nlPlaceholder"
            required
          />
          <input type="hidden" name="email_address_check" value="" />
          <!-- trap for robots: invisible to people, robots fill it -->
          <div class="nl-trap" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off" /></label></div>
          <button type="submit" data-i18n="home.nlJoin">Join</button>
        </div>
        <p class="newsletter-status" role="status" aria-live="polite" data-i18n="home.nlNote">You will receive a confirmation email from Brevo.</p>
        <p class="newsletter-legal"><span data-i18n="home.nlLegal">Your email is used only for the newsletter (Brevo). Unsubscribe at any time.</span></p>
      </form>
    </aside>
  </main>
  <footer class="home-legal"><a href="mentions-legales.html" data-i18n="legal.link">Legal notice</a></footer>
<script src="i18n/en.js?v=10"></script>
<script src="i18n/fr.js?v=15"></script>
<script src="i18n/i18n.js?v=1"></script>
<script src="script.js?v=20261117b"></script>
 
</body>
</html>
